schema_version: 1

context:
  name: ibmcloudant
  version: "0.11.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ibmcloudant-${{ version }}.tar.gz
  sha256: 6ba23cc2e514364e4156b6e86c9f3f4bd03a500e5ab3e2c297bea95588a9cd62

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=4.0.2,<5
  run:
    - python >=${{ python_min }}
    - ibm-cloud-sdk-core ==3.28.0
    - requests >=2.32.4,<3.0.0
    - python-dateutil >=2.5.3,<3.0.0
    - pyjwt >=2.0.1,<3.0.0
tests:
  - python:
      imports:
        - ibmcloudant
      python_version:
        - ${{ python_min }}.*
        - '*'
      pip_check: true

about:
  summary: Python client library for IBM Cloudant
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/IBM/cloudant-python-sdk
  repository: https://github.com/IBM/cloudant-python-sdk
  documentation: https://github.com/IBM/cloudant-python-sdk/blob/main/README.md

extra:
  recipe-maintainers:
    - xylar
