schema_version: 1

context:
  name: ibmcloudant
  version: "0.11.15"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ibmcloudant-${{ version }}.tar.gz
  sha256: e2fc02f5219255edb6bd9ae00835744fe7193b98448438522b5feff8f32a812d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=4.0.2,<5
  run:
    - python >=${{ python_min }}
    - ibm-cloud-sdk-core ==3.28.1
    - requests >=2.32.4,<3.0.0
tests:
  - python:
      imports:
        - ibmcloudant
      python_version:
        - ${{ python_min }}.*
        - '*'
      pip_check: true

about:
  summary: Python client library for IBM Cloudant
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/IBM/cloudant-python-sdk
  repository: https://github.com/IBM/cloudant-python-sdk
  documentation: https://github.com/IBM/cloudant-python-sdk/blob/main/README.md

extra:
  recipe-maintainers:
    - xylar
